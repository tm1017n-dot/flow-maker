<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow Maker — 業務の流れを、ひと目で。</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-icon">↗</span><span>flow<span class="brand-light">maker</span><small>WORKFLOW STUDIO</small></span></div>
      <div class="sidebar-label">ワークスペース</div>
      <button class="nav active" type="button"><span>▦</span> フローエディター <span class="nav-dot"></span></button>
      <div class="sidebar-label second">図形を追加</div>
      <div class="palette" id="palette">
        <button type="button" data-add="start"><span class="palette-icon start">●</span><span>開始・終了<small>フローの入口と出口</small></span><b>＋</b></button>
        <button type="button" data-add="task"><span class="palette-icon task">▣</span><span>作業<small>担当者が行う処理</small></span><b>＋</b></button>
        <button type="button" data-add="decision"><span class="palette-icon decision">◇</span><span>判断<small>条件による分岐</small></span><b>＋</b></button>
        <button type="button" data-add="document"><span class="palette-icon document">▤</span><span>帳票<small>申請書・通知書など</small></span><b>＋</b></button>
        <button type="button" data-add="system"><span class="palette-icon system">▧</span><span>システム<small>利用するシステム</small></span><b>＋</b></button>
      </div>
      <button type="button" class="add-lane" id="addLane">＋ 担当レーンを追加</button>
      <div class="sidebar-bottom"><span class="online-dot"></span> オフラインで利用できます <small>データはこのPCに保存されます</small></div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="title-wrap"><div class="eyebrow">WORKFLOW / EDITOR <span>・ PROTOTYPE</span></div><input id="flowTitle" aria-label="図の名前" maxlength="200" value="申請受付の業務フロー"><div class="save-status" id="saveStatus">未保存の変更があります</div></div>
        <div class="top-actions">
          <button type="button" class="icon-button" id="undoBtn" title="元に戻す (Ctrl+Z)" aria-label="元に戻す">↶</button>
          <button type="button" class="icon-button" id="redoBtn" title="やり直す (Ctrl+Y)" aria-label="やり直す">↷</button>
          <span class="divider"></span>
          <button type="button" class="secondary" id="newBtn">新規</button>
          <button type="button" class="secondary" id="openBtn">開く</button>
          <button type="button" class="secondary" id="saveBtn">保存</button>
          <button type="button" class="primary" id="exportBtn">↗ 出力する</button>
        </div>
      </header>
      <section class="intro-bar"><div><span class="step-pill">EDITING</span><strong>担当ごとの流れを、ひとつの図に。</strong><span id="hint">図形を選んで、右側で内容を編集できます。</span></div><button type="button" id="sampleBtn">サンプルを読み込む ↗</button></section>
      <div class="editor-layout">
        <div class="canvas-section">
          <div class="canvas-toolbar"><div class="toolbar-label"><span class="mini-grid">▦</span> キャンバス <span class="toolbar-count" id="counts"></span></div><div class="toolbar-controls"><button type="button" id="zoomOut" aria-label="縮小">−</button><span id="zoomLabel">100%</span><button type="button" id="zoomIn" aria-label="拡大">＋</button><span class="divider"></span><button type="button" id="fitBtn">全体表示</button></div></div>
          <div class="canvas-scroll" id="canvasScroll"><div class="canvas-inner" id="canvasInner"><svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="業務フロー図"></svg></div></div>
          <div class="canvas-footer"><span>クリックで選択 ・ ドラッグで移動 ・ 「つなぐ」で接続</span><span id="footerMeta"></span></div>
        </div>
        <aside class="inspector"><div class="inspector-head"><span>プロパティ</span><span class="inspector-badge">INSPECTOR</span></div><div id="inspectorBody"></div></aside>
      </div>
    </main>
  </div>

  <input id="fileInput" type="file" accept=".json,application/json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="exportDialog" class="modal"><form method="dialog"><div class="modal-head"><div class="eyebrow">EXPORT WORKFLOW</div><h2>図を書き出す</h2><p>資料に貼り付けやすい形式で保存します。</p></div><label>用紙サイズ<select id="paperSize"><option value="a4">A4 横</option><option value="a3">A3 横</option></select></label><div class="export-preview" id="exportPreview"></div><p class="export-warning" id="exportWarning"></p><div class="modal-actions"><button value="cancel" class="secondary">閉じる</button><button type="button" id="pngBtn" class="secondary">PNGを保存</button><button type="button" id="pdfBtn" class="primary">PDFを印刷・保存</button></div></form></dialog>
  <div id="printArea" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
